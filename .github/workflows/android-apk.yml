name: Build CassetteStudio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 【修复点1】把 Gradle 下载到 /tmp 目录，防止被下面的源码解压脚本误抓
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          # 【修复点2】寻找 zip 时，排除掉 gradle 相关的包
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" ! -iname "gradle-*" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: 在 GitHub 仓库根目录没有找到源码 ZIP 压缩包！请检查是否上传了 .zip 文件。"
            exit 1
          fi
          echo "✅ 找到源码压缩包: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate and build Android project
        run: |
          # 寻找 settings.gradle
          PROJECT_FILE=$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ ERROR: 解压后找不到 settings.gradle 文件。当前解压出的文件如下："
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "✅ 找到项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "🚀 开始执行 Gradle 编译..."
          gradle --no-daemon assembleDebug

          echo "🔍 收集生成的 APK..."
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CassetteStudio-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
