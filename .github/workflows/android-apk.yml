name: Build CassetteStudio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 根目录下没有找到 ZIP 压缩包"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate and build Android project
        run: |
          # 1. 寻找 settings.gradle 确定项目根目录
          PROJECT_FILE=$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ ERROR: 解压后找不到 settings.gradle 文件。当前文件结构如下："
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          # 2. 进入项目目录
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "✅ 找到项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. 打印模块信息供调试
          echo "📦 当前包含的模块 (见 settings.gradle):"
          cat settings.gradle || cat settings.gradle.kts

          # 4. 开始构建（直接执行 assembleDebug，不写死模块名）
          echo "🚀 开始执行 Gradle 编译..."
          gradle --no-daemon assembleDebug

          # 5. 全局搜索生成的 APK 并复制到输出目录
          echo "🔍 查找生成的 APK..."
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CassetteStudio-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
