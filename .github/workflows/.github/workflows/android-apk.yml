
name: Build CassetteStudio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate and build Android project
        run: |
          PROJECT_FILE=$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find app/build/outputs/apk/debug -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CassetteStudio-Xperia1V-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
